# ============================================
# # Flume采集配置文件
# # 用户行为日志实时采集
# # ============================================
#
# # ===== 组件定义 =====
a1.sources = r1
a1.channels = c1
a1.sinks = k1
#
# # ===== Source配置 =====
# # Taildir Source：监控日志文件，支持断点续传
a1.sources.r1.type = TAILDIR
a1.sources.r1.positionFile = /opt/module/datas/hbase/taildir_position.json
a1.sources.r1.filegroups = f1
a1.sources.r1.filegroups.f1 = /opt/module/datas/hbase/logs/user_action.log
a1.sources.r1.batchSize = 100
#
# # ===== Channel配置 =====
# # Memory Channel：高吞吐、低延迟
# # 注意：transactionCapacity >= batchSize
a1.channels.c1.type = memory
a1.channels.c1.capacity = 1000
a1.channels.c1.transactionCapacity = 200
a1.channels.c1.byteCapacity = 104857600  # 100MB
#
# # ===== Sink配置 =====
# # 自定义PhoenixSink
a1.sinks.k1.type = com.asxy.flume.PhoenixSink
a1.sinks.k1.batchSize = 100
a1.sinks.k1.maxRetries = 3
#
# # ===== 绑定关系 =====
a1.sources.r1.channels = c1
a1.sinks.k1.channel = c1
